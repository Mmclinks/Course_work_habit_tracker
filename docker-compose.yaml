version: '3.9'

services:
  web:
    build: .
    command: >
      bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      - HOST=db
      - USER=${USER}
      - PASSWORD=${PASSWORD}
      - NAME=${NAME}
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:17
    env_file:
      - .env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: habit_tracker_redis
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  celery:
    build: .
    container_name: habit_tracker_celery
    restart: always
    depends_on:
      - web
      - redis
    env_file:
      - .env
    command: celery -A config worker --loglevel=info

  celery-beat:
    build: .
    container_name: habit_tracker_celery_beat
    restart: always
    depends_on:
      - web
      - redis
      - celery
    env_file:
      - .env
    command: celery -A config beat --loglevel=info

volumes:
  postgres_data:
  static_volume:
  redis_data:
